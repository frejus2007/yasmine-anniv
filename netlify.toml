[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Les routes /api/* sont servies par netlify/functions/messages.mjs (export config.path).
# Le reste renvoie vers la SPA React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
